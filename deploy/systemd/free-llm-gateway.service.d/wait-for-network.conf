# Optional drop-in for a systemd --user service named "free-llm-gateway".
# Install: mkdir -p ~/.config/systemd/user/free-llm-gateway.service.d
#          cp wait-for-network.conf ~/.config/systemd/user/free-llm-gateway.service.d/
#          systemctl --user daemon-reload && systemctl --user restart free-llm-gateway
#
# A user service cannot rely on network-online.target, so wait here until DNS answers (at most 90 s) before the
# gateway lists the providers' models. It never blocks the start: after 90 s the gateway starts anyway and keeps
# retrying the providers it could not reach (discoveryRetrySeconds).
[Service]
TimeoutStartSec=120
ExecStartPre=/bin/sh -c 'for i in $(seq 1 45); do getent hosts api.groq.com >/dev/null 2>&1 && exit 0; sleep 2; done; echo "free-llm-gateway: DNS not ready after 90 s, starting anyway"; exit 0'
